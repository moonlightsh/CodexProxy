[workspace]
resolver = "2"
members = [
  "crates/helper-core",
  "apps/credential",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
directories = "6"
dunce = "1"
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
toml_edit = "0.22"
wiremock = "0.6"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
helper-core = { path = "crates/helper-core" }

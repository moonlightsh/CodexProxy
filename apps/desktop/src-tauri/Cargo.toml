[package]
name = "codex-helper"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "CodexHelper：受管网关配置与本地分流代理"

[[bin]]
name = "codex-helper"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
helper-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# 内部升级渠道：检测/下载/校验签名/安装（设计 §15）。
# 改用 native-tls（Windows 走 SChannel，macOS 走 Security.framework）而非默认 rustls，
# 避开 rustls 依赖的 ring 在 macOS 交叉编译到 windows-msvc 时编译 C 源码的问题（门禁的 check-windows）；
# 保留 zip（NSIS 更新包解压）与 system-proxy（跟随系统代理）。
tauri-plugin-updater = { version = "2", default-features = false, features = [
  "native-tls",
  "system-proxy",
  "zip",
] }

# 退出前检测 codex.exe：ToolHelp32 进程快照
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Diagnostics_ToolHelp"] }

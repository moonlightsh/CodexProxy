name: Release

# 仅 v* 标签触发（设计 §12）。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  TARGET_TRIPLE: x86_64-pc-windows-msvc
  SIDECAR_NAME: codex-helper-credential

jobs:
  windows-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # tauri.conf.json 的 version 是 NSIS 安装包与桌面应用的唯一版本来源；
      # 标签与它不一致大概率是忘记同步版本号，直接失败比发出错版本的安装包更安全。
      - name: 校验 tag 版本与 tauri.conf.json 一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CONF_VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          echo "tag=$TAG_VERSION conf=$CONF_VERSION"
          if [ "$TAG_VERSION" != "$CONF_VERSION" ]; then
            echo "::error::标签版本 v$TAG_VERSION 与 tauri.conf.json 中的 version=$CONF_VERSION 不一致"
            exit 1
          fi

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 构建产物
        uses: Swatinem/rust-cache@v2

      - name: 安装前端依赖
        run: npm ci --prefix apps/desktop

      - name: 构建凭据程序（sidecar）
        run: cargo build --release -p codex-helper-credential

      # Tauri externalBin 要求 sidecar 文件名带上目标三元组后缀；
      # 该目录已在 .gitignore 中忽略，仅在发布构建时临时生成。
      - name: 复制 sidecar 到 externalBin 约定路径
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/${SIDECAR_NAME}.exe \
             "apps/desktop/src-tauri/binaries/${SIDECAR_NAME}-${TARGET_TRIPLE}.exe"
          ls -la apps/desktop/src-tauri/binaries

      # externalBin 只在发布时通过 --config 与 tauri.bundle.conf.json 合并进主配置，
      # 避免普通 cargo build / clippy / test 因缺少 sidecar 而失败（实施计划 §3 阶段 1 任务 1.8）。
      # --config 的路径基准是执行 tauri 命令时的当前目录，这里在 apps/desktop 下执行，
      # 因此写相对于 apps/desktop 的路径；externalBin 里的相对路径则始终以
      # tauri.conf.json 所在目录（src-tauri）为基准解析，与该配置文件放在哪里无关。
      - name: tauri build（合并 externalBin 配置）
        working-directory: apps/desktop
        env:
          # createUpdaterArtifacts=true 要求签名私钥；缺失会导致构建失败（设计 §15.3）。
          # 私钥无密码，无需 *_PASSWORD；需在仓库 Secrets 配置。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npx tauri build --config src-tauri/tauri.bundle.conf.json

      - name: 定位 NSIS 安装包
        id: find_installer
        run: |
          shopt -s nullglob
          installers=(target/release/bundle/nsis/*-setup.exe)
          shopt -u nullglob
          if [ ${#installers[@]} -eq 0 ]; then
            echo "::error::未找到 NSIS 安装包，tauri build 可能未生成预期产物"
            exit 1
          fi
          echo "path=${installers[0]}" >> "$GITHUB_OUTPUT"

      # 生成 updater 的 latest.json；若配置了 Nexus 部署凭据则一并发布到内网 cypub。
      # 注意：GitHub 云端 runner 访问不到内网 rdc.tiandy.com——需在内网自托管 runner 上
      # 配置 NEXUS_DEPLOY_USER/NEXUS_DEPLOY_PASS 才会真正上传；否则本步骤仅生成 latest.json，
      # 可在内网机器上运行 scripts/publish-update.sh 完成发布（设计 §15.7）。
      - name: 生成 manifest 并（可选）发布到内网 Nexus
        env:
          NEXUS_DEPLOY_USER: ${{ secrets.NEXUS_DEPLOY_USER }}
          NEXUS_DEPLOY_PASS: ${{ secrets.NEXUS_DEPLOY_PASS }}
        run: bash scripts/publish-update.sh

      - name: 上传安装包与更新产物到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 预发布标签（v*-*，如 v0.3.0-rc.1）自动标记 prerelease，不出现在 latest。
          prerelease: ${{ contains(github.ref_name, '-') }}
          # 同时上传：安装器 *-setup.exe（也是 updater 下载目标）、其 .sig 签名、以及 latest.json。
          files: |
            ${{ steps.find_installer.outputs.path }}
            target/release/bundle/nsis/*-setup.exe.sig
            target/release/bundle/nsis/latest.json
          fail_on_unmatched_files: true

  # macOS universal dmg（设计 §7）。needs windows-release 让两个 job 串行，
  # 避免同时为同一 tag 创建 Release；本 job 只上传 dmg 并补写 Release 正文。
  macos-release:
    runs-on: macos-latest
    needs: windows-release
    defaults:
      run:
        shell: bash
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # 与 windows-release 同名步骤逐字相同：dmg 文件名与 Info.plist 版本也取自 tauri.conf.json。
      - name: 校验 tag 版本与 tauri.conf.json 一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CONF_VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          echo "tag=$TAG_VERSION conf=$CONF_VERSION"
          if [ "$TAG_VERSION" != "$CONF_VERSION" ]; then
            echo "::error::标签版本 v$TAG_VERSION 与 tauri.conf.json 中的 version=$CONF_VERSION 不一致"
            exit 1
          fi

      # universal 构建要分别编译 arm64 与 x86_64，两个标准库都要装。
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 缓存 cargo 构建产物
        uses: Swatinem/rust-cache@v2

      - name: 安装前端依赖
        run: npm ci --prefix apps/desktop

      # 脚本负责凭据程序 lipo 合成、tauri build 与产物自检，并把 dmg 路径写进 GITHUB_OUTPUT。
      # macOS 不生成升级产物（createUpdaterArtifacts=false），因此不需要签名私钥，
      # 也不调用 publish-update.sh：latest.json 仍只含 windows-x86_64。
      - name: 构建 universal dmg
        id: build
        run: bash scripts/build-macos.sh

      # windows-release 不写 Release 正文，由这里补上 macOS 安装说明（设计 §7.3）。
      - name: 上传 dmg 到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.dmg }}
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## macOS 安装说明（内部试用）

            1. 打开 dmg，把 CodexHelper 拖到「应用程序」。
            2. 首次打开被拦截时：系统设置 → 隐私与安全性 → “仍要打开”；或执行
               `xattr -dr com.apple.quarantine /Applications/CodexHelper.app`。
            3. 卸载：先在菜单栏图标选“撤销配置并退出”，再把应用拖进废纸篓。如果已经先删了应用、Codex 打不开对话：重新安装后执行一次撤销。
            4. 删除 Key（可选）：`security delete-generic-password -s codex-helper/managed-gateway -a codex-helper`。

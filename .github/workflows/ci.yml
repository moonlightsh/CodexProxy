name: CI

# push / pull_request 均触发（设计 §12、实施计划 §4 门禁）。
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo 构建产物
        uses: Swatinem/rust-cache@v2

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          # 24：前端单元测试用 `node --test --experimental-strip-types` 直接运行 .ts。
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: 安装前端依赖
        run: npm ci --prefix apps/desktop

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Windows 矩阵上本步骤会一并跑 Credential Manager 真实读写测试
      # 与 codex-helper-credential 的 stdout / stderr 约定测试（设计 §11「Windows 专属」）。
      - name: cargo test
        run: cargo test --workspace

      - name: 前端类型检查
        run: npm --prefix apps/desktop run check

      - name: 前端单元测试
        run: npm --prefix apps/desktop test

      # push 通过门禁后提供可手动安装的 Windows 测试包；不创建 Release，
      # 不生成/发布 updater 产物，也不需要访问签名私钥或内网部署凭据。
      - name: 构建 Windows 凭据程序及 sidecar
        if: runner.os == 'Windows' && github.event_name == 'push'
        shell: bash
        run: |
          cargo build --release -p codex-helper-credential
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/codex-helper-credential.exe \
            apps/desktop/src-tauri/binaries/codex-helper-credential-x86_64-pc-windows-msvc.exe

      - name: 构建 Windows NSIS 测试安装包
        if: runner.os == 'Windows' && github.event_name == 'push'
        working-directory: apps/desktop
        shell: bash
        run: >-
          npx tauri build --ci
          --config src-tauri/tauri.bundle.conf.json
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: 上传 Windows 测试安装包
        if: runner.os == 'Windows' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: CodexHelper-windows-x64-${{ github.sha }}
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
